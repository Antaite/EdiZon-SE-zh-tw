name: 查詢舊版編譯環境
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in 1 2 3 4 5 6; do curl -s "https://hub.docker.com/v2/repositories/devkitpro/devkita64/tags?page_size=100&page=$p" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(t['name'],t.get('last_updated','')[:10]) for t in d.get('results',[])]"; done | sort
