# 自動編譯：用 devkitA64 編譯 EdiZon SE 繁中版，並發佈測試版方便下載
# EdiZon SE 用的是作者 tomvita 自己維護的 libnx 分支（保留舊的觸控與按鍵 API，同時跟進新韌體支援），
# 所以編譯前先把它安裝進去，取代官方 libnx。
name: 編譯

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  TOMVITA_LIBNX_COMMIT: 50396eeb52cbb3feddbbfdc6482f4b704a1f90b3   # tomvita/libnx master，2026-05-05

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 tomvita 版 libnx
        run: |
          git init -q /tmp/libnx
          cd /tmp/libnx
          git remote add origin https://github.com/tomvita/libnx.git
          git fetch -q --depth 1 origin "$TOMVITA_LIBNX_COMMIT"
          git checkout -q FETCH_HEAD
          make -j"$(nproc)" install > /tmp/libnx.log 2>&1 || (tail -40 /tmp/libnx.log; exit 1)

      - name: 編譯
        run: |
          export PATH=/opt/devkitpro/portlibs/switch/bin:$PATH
          # 新版 portlibs 沒有 freetype-config，Makefile 卻用它取得連結參數，補一個轉呼叫 pkg-config 的小腳本
          if ! command -v freetype-config >/dev/null; then
            printf '#!/bin/sh\nexec aarch64-none-elf-pkg-config "$@" freetype2\n' > /usr/local/bin/freetype-config
            chmod +x /usr/local/bin/freetype-config
          fi
          freetype-config --libs
          make -j"$(nproc)"
          ls -la *.nro

      - name: 發佈測試版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 測試版 ${{ github.run_number }}
          prerelease: true
          files: |
            *.nro
