# 自動編譯：用 devkitA64 編譯 EdiZon SE 繁中版，並發佈測試版方便下載
# EdiZon SE 使用 libnx 4 之前的觸控與按鍵 API，所以固定用 2020 年 7 月的編譯環境（libnx 3.x）。
# 這個舊映像太舊，跑不了 GitHub 的動作元件，所以只在編譯步驟用 docker run 進入映像。
name: 編譯

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 編譯（devkitpro/devkita64:20200730）
        run: |
          docker run --rm -v "$PWD":/src -w /src devkitpro/devkita64:20200730 bash -c '
            export PATH=/opt/devkitpro/portlibs/switch/bin:$PATH
            grep -h "LIBNX_MAJOR\|LIBNX_MINOR" /opt/devkitpro/libnx/include/switch/*.h 2>/dev/null | head -3 || true
            make -j"$(nproc)"
          '
          ls -la *.nro

      - name: 發佈測試版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 測試版 ${{ github.run_number }}
          prerelease: true
          files: |
            *.nro
