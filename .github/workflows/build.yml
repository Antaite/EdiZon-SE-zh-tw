# 自動編譯：用 devkitA64 編譯 EdiZon SE 繁中版，並發佈測試版方便下載
name: 編譯

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # EdiZon SE 使用 libnx 4 之前的觸控與按鍵 API，所以固定用 2020 年 7 月的編譯環境（libnx 3.x）
    container: devkitpro/devkita64:20200730
    steps:
      - uses: actions/checkout@v4

      - name: 檢查編譯環境
        run: |
          grep -m3 "LIBNX_M\|LIBNX_P" /opt/devkitpro/libnx/include/switch.h /opt/devkitpro/libnx/*.mk 2>/dev/null || true
          ls /opt/devkitpro/portlibs/switch/lib | head -50

      - name: 編譯
        run: |
          export PATH=/opt/devkitpro/portlibs/switch/bin:$PATH
          make -j"$(nproc)"
          ls -la *.nro

      - name: 發佈測試版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 測試版 ${{ github.run_number }}
          prerelease: true
          files: |
            *.nro
